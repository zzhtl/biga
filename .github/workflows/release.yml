name: Release

# 打 v* 标签即出包；也可手动触发（手动时必须给标签名，产物同样挂到该标签的草稿 Release）。
# Release 一律建成 draft：本项目没有代码签名，发出去之前你应该先自己装一遍确认能跑。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "发布标签，如 v0.1.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: true

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # 先卡版本号：包名取自 tauri.conf.json 的 version，和标签对不上会发出
  # 「标签 v0.3.0 里躺着 BigA_0.1.0_amd64.deb」这种没人看得懂的产物。
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 校验标签与 tauri.conf.json 版本一致
        run: |
          conf_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag_version="${RELEASE_TAG#v}"
          echo "tauri.conf.json = $conf_version, 标签 = $tag_version"
          if [ "$conf_version" != "$tag_version" ]; then
            echo "::error::版本不一致。请把 src-tauri/tauri.conf.json 的 version 改成 $tag_version 后重新打标签"
            exit 1
          fi

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 而不是 latest：latest 已是 24.04（glibc 2.39），
          # 在上面产出的包在老一点的发行版上直接跑不起来。22.04 是 glibc 2.35。
          - platform: ubuntu-22.04
            name: linux-x86_64
            args: --bundles deb,appimage
            artifacts: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage

          - platform: windows-latest
            name: windows-x86_64
            args: --bundles nsis,msi
            artifacts: |
              src-tauri/target/release/bundle/nsis/*-setup.exe
              src-tauri/target/release/bundle/msi/*.msi

          # 只做 Apple Silicon。macos-14 runner 本身就是 arm64，显式写 target
          # 一是把「仅 M 芯片」这件事写进产物路径，二是杜绝哪天 runner 换成 x86 后悄悄出错包。
          - platform: macos-14
            name: macos-aarch64
            args: --target aarch64-apple-darwin --bundles dmg
            rust-target: aarch64-apple-darwin
            artifacts: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}

      # 与 ci.yml 保持同一份依赖清单
      - name: Install Tauri system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libsoup-3.0-dev \
            libxdo-dev \
            build-essential curl wget file

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # 注意没有 `--` 分隔符：bun 会把参数直接透传给脚本，多写一个 `--`
      # 会让 tauri CLI 把后面的东西当成 cargo 参数，报 unexpected argument '--bundles'。
      # tauri.conf.json 的 beforeBuildCommand 会自己跑 bun run build 生成前端产物。
      - name: Build bundles
        run: bun run tauri build ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

      - name: 挂到草稿 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: BigA ${{ env.RELEASE_TAG }}
          draft: true
          files: ${{ matrix.artifacts }}
          body: |
            ## 安装

            | 平台 | 文件 |
            |---|---|
            | Windows 10/11 x64 | `*-setup.exe`（推荐）或 `*.msi` |
            | Linux x86_64 | `*.AppImage`（免安装，`chmod +x` 后直接运行）或 `*.deb` |
            | macOS Apple Silicon | `*.dmg`（仅 M 系列芯片，不支持 Intel Mac） |

            ## 未做代码签名

            本项目没有购买签名证书，系统会拦截：

            - **Windows**：SmartScreen 提示「已保护你的电脑」→ 点「更多信息」→「仍要运行」
            - **macOS**：提示「已损坏，无法打开」是 Gatekeeper 的隔离属性所致，装好后执行
              `xattr -cr /Applications/BigA.app` 再打开
            - **Linux**：无此问题

            ## 首次使用

            应用需要 zhituapi 的 API 密钥才能取数，在「系统设置」里填写。
            数据库首次启动会自动创建在系统应用数据目录下（Windows `%APPDATA%\com.biga.app`、
            Linux `~/.local/share/com.biga.app`、macOS `~/Library/Application Support/com.biga.app`）。

            ---

            股市有风险，投资需谨慎。本工具不构成任何投资建议。
